services:
  postgres:
    # pgvector/pgvector:pg16, not plain postgres:16 — a drop-in build with
    # the pgvector extension already compiled in (needed for
    # document_chunks' embedding column, see migration 026). Real RDS
    # Postgres 16 supports `CREATE EXTENSION vector` out of the box; this
    # is the equivalent for local dev/test.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: edd_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - edd-workbench-postgres-data:/var/lib/postgresql/data

  # Local substitute for S3 (documents bucket) — see build plan/grilling
  # session notes: real S3 during automated tests risks cruft/collisions in
  # the shared staging bucket, so ingest tests run against this instead.
  # Buckets aren't auto-created by MinIO itself; test setup creates them via
  # the S3 SDK against this endpoint (see documents.test.ts).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - edd-workbench-minio-data:/data

  # Local substitute for SQS (ingest/export queues) — real SQS-protocol
  # compatible, so the actual enqueue/consume code paths run against it
  # unmodified. Queues aren't pre-created; test setup creates them via the
  # SQS SDK against this endpoint, same pattern as the MinIO bucket above.
  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"

volumes:
  edd-workbench-postgres-data:
  edd-workbench-minio-data:
